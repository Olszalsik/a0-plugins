title: Model Fallback System
description: Multi-cycle model failover for Agent Zero. When a provider rate-limits, times out or 5xxs, it rotates through fallback model candidates using shared cooldowns, permanent-failure detection, latency-learned warm/cold timeouts, background recovery probes and an extended-retry mode for hour-long quota resets. Covers the chat, utility and main-loop turn paths, and modifies no core agent-zero file.
github: https://github.com/Olszalsik/a0-model-fallback
